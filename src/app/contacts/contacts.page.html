<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Contacts</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-input label="Name" labelPlacement="stacked" [(ngModel)]="name"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Phone" labelPlacement="stacked" type="tel" [(ngModel)]="phone"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Email" labelPlacement="stacked" type="email" [(ngModel)]="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Pronouns" labelPlacement="stacked" [(ngModel)]="pronouns"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" (click)="add()" [disabled]="!name.trim() || !phone.trim()">
    Add contact
  </ion-button>

  @if (error()) {
  <p role="alert">{{ error() }}</p>
  }

  <h2>Contacts ({{ contacts().length }})</h2>
  <ion-list>
    @for (contact of contacts(); track contact.id) {
    <ion-item>
      <ion-label>
        <h2>{{ contact.name }}</h2>
        <p>{{ contact.phone }}</p>
        <p>{{ contact.email }}</p>
        <p>{{ contact.pronouns }}</p>
      </ion-label>
    </ion-item>
    } @empty {
    <ion-item>No contacts yet.</ion-item>
    }
  </ion-list>
</ion-content>
